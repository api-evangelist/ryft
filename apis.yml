aid: ryft
name: Ryft
description: >-
  Ryft is the intelligent Apache Iceberg management platform - a data lakehouse
  optimization layer that continuously monitors, manages, and optimizes Iceberg
  tables across query engines and clouds. It provides automated table
  compaction, snapshot and data lifecycle management, orphan-file and
  compliance cleanup (GDPR/CCPA), an Asset and Query Explorer, and usage-based
  self-tuning that reduces lakehouse TCO and speeds up queries. Ryft integrates
  with AWS (Athena, Glue, Redshift, S3 Tables), Google Cloud/BigLake, Azure,
  Microsoft OneLake, Databricks, Snowflake, Starburst, Trino, StarRocks, and any
  Iceberg REST Catalog. For engines it does not natively support, the Ryft Ingest
  API accepts query telemetry directly, and the Ryft MCP server enriches AI
  agents with live lakehouse context. Backed by Bessemer Venture Partners and
  Index Ventures; acquired by Cyera in 2026.
