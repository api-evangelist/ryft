    post:
      tags: [Ingest]
      operationId: pushQueries
      summary: Push query data
      description: >-
        Send one query object, or a JSON array of query objects for bulk
        ingestion. A 200 response means the message was accepted and will be
        processed.
      security:
        - RyftIngestToken: []
