info:
  title: Ryft Ingest API
  version: '1.0'
  description: >-
    The Ryft Ingest API accepts query-execution data from any custom query
    engine so Ryft can build usage-based Apache Iceberg optimizations. Send
    query telemetry (SQL text, timing, state, context) as JSON, singly or in
    bulk. Authenticated with a per-environment ingest token.
  contact:
    name: Ryft Support
    email: support@ryft.io
    url: https://docs.ryft.io/integrations/custom-engine
